<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7D71F7">
  <title>Perseus — сайт працює</title>
  <style>
    :root{--primary:#7D71F7;--accent:#FFCD18;--text:#121212;--pink:#F5245F;--bg:#F5FAFE}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(760px,100%);padding:64px 48px;border:2px solid var(--text);border-radius:32px;background:#fff;box-shadow:12px 12px 0 var(--primary);text-align:center}
    .badge{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:var(--accent);font-weight:800}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--pink)}
    h1{margin:28px 0 16px;font-size:clamp(42px,9vw,88px);line-height:.95;letter-spacing:-.06em}
    h1 span{color:var(--primary)}
    p{margin:0 auto;max-width:560px;font-size:clamp(18px,3vw,24px);line-height:1.45}
    small{display:block;margin-top:34px;color:#666}
    @media(max-width:560px){main{padding:48px 24px;border-radius:24px;box-shadow:8px 8px 0 var(--primary)}}
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot"></span> Тестове підключення</div>
    <h1><span>Perseus</span> працює</h1>
    <p>Домен і GitHub Pages налаштовуються. Далі тут з’явиться повноцінний лендінг дизайн-студії.</p>
    <small>perseus.company</small>
  </main>
</body>
</html>
